<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إنشاء حساب | مذاق البن</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8f2ec;color:#33241c;font-family:Tahoma,Arial,sans-serif}.auth-page{width:min(560px,calc(100% - 28px));margin:45px auto}.auth-card{padding:34px;border:1px solid #eaded4;border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(63,36,21,.13)}.auth-brand{display:block;margin-bottom:24px;color:#3f2415;text-align:center;text-decoration:none;font-size:25px;font-weight:900}.auth-card h1{margin:0 0 8px;text-align:center}.auth-lead{margin:0 0 26px;color:#806f64;text-align:center}.auth-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.auth-field label{display:block;margin-bottom:7px;font-weight:800}.auth-field input{width:100%;height:51px;padding:0 14px;border:1px solid #d9c8bc;border-radius:12px;font:inherit;outline:none}.auth-field input:focus{border-color:#6f4328;box-shadow:0 0 0 3px rgba(111,67,40,.12)}.auth-submit{width:100%;min-height:51px;margin-top:20px;border:0;border-radius:12px;color:#fff;background:#6f4328;font:inherit;font-weight:900;cursor:pointer}.auth-switch{margin:24px 0 0;text-align:center}.auth-switch a{color:#6f4328;font-weight:900}.errorlist{margin:6px 0 0;padding:0;list-style:none;color:#9b2525;font-size:12px}@media(max-width:580px){.auth-fields{grid-template-columns:1fr}.auth-card{padding:25px}}
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="{% url 'core:home' %}">☕ مذاق البن</a>
            <h1>إنشاء حساب</h1>
            <p class="auth-lead">يكفي إدخال البريد الإلكتروني أو رقم الجوال.</p>
            {{ form.non_field_errors }}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                <div class="auth-fields">
                    {% for field in form %}
                        <div class="auth-field">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}{{ field.errors }}
                        </div>
                    {% endfor %}
                </div>
                <button class="auth-submit" type="submit">إنشاء حساب</button>
            </form>
            <p class="auth-switch">لديك حساب؟ <a href="{% url 'accounts:login' %}">تسجيل الدخول</a></p>
        </section>
    </main>
</body>
</html>
