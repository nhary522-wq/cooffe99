<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{% block meta_description %}متجر A23 لمحاصيل وأدوات القهوة{% endblock %}"><title>{% block title %}المتجر{% endblock %} | A23</title>
    <style>
        :root{--primary:#6f4328;--dark:#3f2415;--secondary:#a86f47;--light:#f8f2ec;--white:#fff;--text:#33241c;--muted:#7f6c60;--border:#eaded4;--success:#34785b;--danger:#9c3f3f;--shadow:0 16px 45px rgba(63,36,21,.12)}*{box-sizing:border-box}body{margin:0;color:var(--text);background:#fff;font-family:Tahoma,Arial,"Segoe UI",sans-serif;line-height:1.75}a{color:inherit}.store-hero{padding:72px 20px 58px;text-align:center;color:#fff;background:linear-gradient(135deg,rgba(47,24,12,.97),rgba(116,69,42,.9))}.store-hero span{color:#e8c09c;font-size:13px;font-weight:900}.store-hero h1{margin:8px 0 10px;font-size:clamp(32px,5vw,52px)}.store-hero p{max-width:700px;margin:auto;color:#e7d8cc}.store-container{width:min(1180px,calc(100% - 30px));margin:auto;padding:50px 0 85px}.store-toolbar{margin-bottom:28px;padding:14px;display:flex;gap:10px;border:1px solid var(--border);border-radius:18px;background:var(--light)}.store-toolbar input{min-width:0;height:48px;flex:1;padding:0 15px;border:1px solid #d9c8bc;border-radius:12px;font:inherit}.store-button{min-height:46px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--primary);border-radius:12px;color:#fff;background:var(--primary);text-decoration:none;font:inherit;font-size:13px;font-weight:900;cursor:pointer;transition:.22s}.store-button:hover{background:var(--dark);transform:translateY(-2px)}.store-button.outline{color:var(--primary);background:#fff}.store-button.danger{color:var(--danger);border-color:#edcece;background:#fff}.store-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.store-card{overflow:hidden;border:1px solid var(--border);border-radius:21px;background:#fff;box-shadow:0 8px 25px rgba(63,36,21,.07);transition:.25s}.store-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}.store-card-image{height:220px;display:block;overflow:hidden;background:var(--light)}.store-card-image img{width:100%;height:100%;object-fit:cover;transition:.4s}.store-card:hover img{transform:scale(1.06)}.store-card-body{padding:19px}.store-card-label{margin:0;color:var(--secondary);font-size:11px;font-weight:900}.store-card h2,.store-card h3{margin:6px 0;color:var(--dark);font-size:18px}.store-card-description{min-height:48px;margin:0 0 14px;color:var(--muted);font-size:12px}.store-price{margin:0;color:var(--dark);font-size:20px;font-weight:900}.store-price small{font-size:11px}.store-card-actions{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.store-card-actions form{display:grid}.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.category-panel{position:relative;min-height:390px;overflow:hidden;border-radius:26px;color:#fff;box-shadow:var(--shadow)}.category-panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.category-panel::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(35,17,8,.94),rgba(35,17,8,.08))}.category-panel-content{position:absolute;right:0;bottom:0;left:0;z-index:1;padding:30px}.category-panel h2{margin:4px 0 8px;font-size:30px}.category-panel p{max-width:500px;margin:0 0 18px;color:#eaded4}.breadcrumbs{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px}.breadcrumbs a{text-decoration:none;color:var(--primary)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:start}.detail-image{overflow:hidden;border-radius:25px;background:var(--light);box-shadow:var(--shadow)}.detail-image img{width:100%;height:520px;object-fit:cover}.detail-info{padding:20px 0}.detail-info h1{margin:8px 0 12px;color:var(--dark);font-size:clamp(30px,4vw,46px)}.detail-description{color:var(--muted);font-size:16px}.quantity-row{margin:22px 0;display:flex;align-items:center;gap:10px}.quantity-row input{width:85px;height:48px;padding:0 12px;border:1px solid var(--border);border-radius:11px;font:inherit}.message-list{width:min(1180px,calc(100% - 30px));margin:18px auto 0;display:grid;gap:8px}.message{padding:12px 15px;border-radius:11px;color:#246048;background:#eef9f3}.cart-layout,.checkout-layout{display:grid;grid-template-columns:1.5fr .75fr;gap:24px;align-items:start}.cart-list,.summary-card,.checkout-card,.order-card{border:1px solid var(--border);border-radius:22px;background:#fff;box-shadow:0 10px 30px rgba(63,36,21,.07)}.cart-item{padding:17px;display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;border-bottom:1px solid var(--border)}.cart-item:last-child{border:0}.cart-item img{width:100px;height:90px;object-fit:cover;border-radius:13px}.cart-item h3{margin:0 0 5px}.cart-item form{display:flex;align-items:center;gap:7px}.cart-item input{width:65px;height:39px;border:1px solid var(--border);border-radius:9px;text-align:center}.summary-card,.checkout-card,.order-card{padding:24px}.summary-row{padding:10px 0;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}.summary-row.total{border:0;color:var(--dark);font-size:20px;font-weight:900}.shipping-note{padding:11px;border-radius:10px;color:#76502f;background:#fff3e8;font-size:12px}.checkout-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.checkout-field{display:grid;gap:6px}.checkout-field.full{grid-column:1/-1}.checkout-field input,.checkout-field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font:inherit}.checkout-options{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}.checkout-options ul{padding:0;display:grid;gap:9px;list-style:none}.checkout-options label{padding:12px;display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:11px;cursor:pointer}.errorlist{margin:3px 0 0;padding:0;list-style:none;color:var(--danger);font-size:11px}.order-status{display:inline-flex;padding:6px 11px;border-radius:999px;color:#fff;background:var(--success);font-size:12px;font-weight:900}.order-items{margin-top:20px}.order-line{padding:12px 0;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}.empty-state{padding:55px 20px;text-align:center;border:1px dashed var(--border);border-radius:20px;color:var(--muted)}@media(max-width:980px){.store-grid{grid-template-columns:repeat(2,1fr)}.cart-layout,.checkout-layout,.detail-grid{grid-template-columns:1fr}.detail-image img{height:420px}}@media(max-width:620px){.store-grid,.category-grid,.checkout-fields{grid-template-columns:1fr}.store-toolbar{flex-direction:column}.cart-item{grid-template-columns:75px 1fr}.cart-item img{width:75px;height:75px}.cart-item>div:last-child{grid-column:1/-1}.store-card-actions{grid-template-columns:1fr}.checkout-field.full{grid-column:auto}}
    </style>
</head>
<body>{% include "header.html" %}{% if messages %}<div class="message-list">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}{% include "footer.html" %}</body>
</html>
