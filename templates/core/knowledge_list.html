{% extends "catalog/base.html" %}{% block title %}موسوعة وأكاديمية القهوة{% endblock %}{% block content %}<main class="store-container" dir="rtl"><h1>موسوعة وأكاديمية القهوة</h1><form method="get"><input name="q" value="{{ query }}" placeholder="ابحث في المحتوى"><select name="category"><option value="">كل التصنيفات</option>{% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}</select><button>بحث</button></form><div class="store-grid">{% for item in contents %}<article class="store-card"><div class="store-card-body"><small>{{ item.category }}</small><h2>{{ item.title }}</h2><p>{{ item.summary }}</p><a href="{% url 'core:knowledge_detail' item.slug %}">اقرأ المزيد</a></div></article>{% empty %}<p>لا يوجد محتوى منشور.</p>{% endfor %}</div></main>{% endblock %}
